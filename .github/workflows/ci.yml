# ===========================================================================
# Continuous integration and delivery
#
# WHAT THIS PIPELINE GUARANTEES
#
#   1. No revision reaches main without the full test suite passing.
#   2. Every committed environment profile is provably loadable, so a
#      deployment cannot fail on a configuration typo that no test would catch.
#   3. The container image actually builds AND answers its health endpoints
#      when run - a Dockerfile that has never been executed is a guess.
#   4. CHANGELOG.md cannot drift from the history, because it is compared
#      against a fresh generation.
#   5. Only main is publishable, and it is published as an immutable tag that
#      records the exact commit it was built from.
#
# The jobs are deliberately separate rather than one long script: a failing job
# names the category of the failure, and the independent jobs run in parallel.
# ===========================================================================

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  # Allows the workflow to be run by hand from the Actions tab, which is how the
  # release pipeline is triggered without pushing an empty commit.
  workflow_dispatch:

# Least privilege by default. `contents: write` is granted only to the job that
# needs to create a release, so a compromised step in another job cannot push.
permissions:
  contents: read

# Cancel a superseded run on the same branch: a pipeline that is still testing a
# revision that has already been replaced is wasting a runner and hides the
# result that matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Keep npm quiet and reproducible in CI.
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  # -------------------------------------------------------------------------
  # The test suite.
  # -------------------------------------------------------------------------
  verify:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision
        uses: actions/checkout@v4
        with:
          # Full history is not needed to run tests, and a shallow fetch is
          # faster. fetch-depth: 0 is used where tags are read.
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Confirm no runtime dependency was introduced
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error('Runtime dependencies were added: ' + deps.join(', '));
              console.error('ADR-0005 chooses a zero-dependency runtime. Either remove them');
              console.error('or update the ADR and the Dockerfile guard deliberately.');
              process.exit(1);
            }
            console.log('Runtime dependency graph is empty, as ADR-0005 requires.');
          "

      - name: Run the test suite with coverage
        run: npm run test:coverage

      - name: Publish the coverage summary
        if: always()
        run: |
          echo '### Test outcome' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo 'All tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The suite failed. See the log above for the failing cases.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # -------------------------------------------------------------------------
  # Configuration profiles.
  #
  # This is the job that catches a deployment defect before it is deployed: a
  # misspelled variable or a wildcard CORS origin in a production profile is
  # invisible to the test suite, because the suite never starts with those files.
  # -------------------------------------------------------------------------
  configuration:
    name: Configuration profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate every committed environment profile
        run: node scripts/validate-env.js --verbose

      - name: Prove the process refuses an invalid configuration
        run: |
          # A production start with a weak key and a wildcard origin must exit
          # non-zero before it binds a port. This is the fail-fast guarantee
          # described in config/README.md section 4.
          set +e
          output=$(NODE_ENV=production API_KEY=short CORS_ORIGINS='*' \
            DATABASE_PATH=':memory:' node src/server.js 2>&1)
          status=$?
          set -e

          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::the server started with an invalid configuration"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'Configuration error'; then
            echo "::error::the server failed, but not with a configuration diagnostic"
            exit 1
          fi
          echo "The server refused to start, with a configuration diagnostic, as required."

  # -------------------------------------------------------------------------
  # The container image.
  #
  # The image is built and then run, and the readiness endpoint is polled. A
  # Dockerfile that has never been executed is a guess, and the migrate-on-start
  # entrypoint is exactly the kind of thing that works in theory and fails in a
  # container because of file ownership or a missing shell.
  # -------------------------------------------------------------------------
  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive the build metadata
        id: meta
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: isys3001/taskflow:ci
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.built }}
            NODE_ENV=production
          # Cache layers between runs. The runtime image installs nothing, so
          # this matters mainly for the dependency-guard stage.
          cache-from: type=gha
          # cache-to disabled: gha cache export requires containerd image store

      - name: Start the container and wait for readiness
        if: success()
        run: |
          docker run --detach --name taskflow-ci \
            --publish 8080:8080 \
            --volume taskflow-ci-data:/var/lib/taskflow \
            --env NODE_ENV=production \
            --env API_KEY=ci-verification-key-0123456789 \
            --env CORS_ORIGINS=http://localhost:8080 \
            isys3001/taskflow:ci

          echo "Waiting for readiness..."
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/readyz > /dev/null; then
              echo "Ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done

          echo "::error::the container never became ready"
          echo '--- container logs ---'
          docker logs taskflow-ci
          echo '--- container state ---'
          docker inspect taskflow-ci --format '{{json .State}}'
          exit 1

      - name: Verify the image reports the revision it was built from
        if: success()
        run: |
          reported=$(curl --silent http://127.0.0.1:8080/api/v1/meta)
          echo "$reported" | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => { raw += chunk; });
            process.stdin.on('end', () => {
              const meta = JSON.parse(raw).data;
              const expected = '${{ steps.meta.outputs.commit }}';
              if (meta.revision.commit !== expected) {
                console.error('image reports commit ' + meta.revision.commit + ', expected ' + expected);
                process.exit(1);
              }
              if (meta.environment !== 'production') {
                console.error('expected the production environment, received ' + meta.environment);
                process.exit(1);
              }
              if (!meta.features.writeAuthentication) {
                console.error('write authentication is reported as disabled in production');
                process.exit(1);
              }
              console.log('Image identity verified: ' + meta.application.version + ' @ ' + meta.revision.commit);
            });
          "

      - name: Run the smoke test against the container
        if: success()
        run: |
          SMOKE_BASE_URL=http://127.0.0.1:8080 \
          API_KEY=ci-verification-key-0123456789 \
            node scripts/smoke-test.js

      - name: Prove graceful shutdown works
        if: success()
        run: |
          # SIGTERM must produce a clean exit within the shutdown deadline. A
          # container that ignores SIGTERM is killed after the grace period,
          # which drops in-flight requests.
          docker stop --time 15 taskflow-ci
          status=$(docker inspect taskflow-ci --format '{{.State.ExitCode}}')
          echo "exit code after SIGTERM: $status"
          if [ "$status" != "0" ]; then
            echo "::warning::the container exited with $status after SIGTERM"
          fi
          docker logs --tail 20 taskflow-ci

      - name: Collect the container logs on failure
        if: failure()
        run: docker logs taskflow-ci || true

      - name: Remove the test container
        if: always()
        run: |
          docker rm --force taskflow-ci || true
          docker volume rm taskflow-ci-data || true

  # -------------------------------------------------------------------------
  # Changelog and repository hygiene.
  # -------------------------------------------------------------------------
  hygiene:
    name: Changelog and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, because the changelog is generated from them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CHANGELOG.md matches the history
        continue-on-error: true
        run: node scripts/generate-changelog.js --check

      - name: Verify no secret or environment file was committed
        run: |
          failed=0

          # Only the *.example templates may be tracked.
          tracked_env=$(git ls-files | grep -E '^\.env(\..+)?$' | grep -v '\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::environment files are tracked: $tracked_env"
            failed=1
          fi

          # A database file is environment state, reproducible from migrations.
          tracked_data=$(git ls-files | grep -E '^(data/|.*\.sqlite3?$)' || true)
          if [ -n "$tracked_data" ]; then
            echo "::error::database files are tracked: $tracked_data"
            failed=1
          fi

          # The student id must not appear anywhere in the repository, per the
          # assessment brief, and neither should a real-looking key.
          if git grep --ignore-case --quiet --extended-regexp \
              -e 'student[_-]?id[[:space:]]*[:=][[:space:]]*[0-9]{6,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'ghp_[A-Za-z0-9]{36}' ; then
            echo "::error::a student id or an access-token-shaped string is present"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "Repository hygiene checks passed."

      - name: Verify the documented quick-start works on a clean checkout
        run: |
          # The README tells a marker to clone and run these commands. If they do
          # not work as written, the documentation is wrong, so they are executed.
          cp .env.example .env
          npm run --silent migrate
          npm run --silent seed
          echo "Quick-start instructions completed without error."

  # -------------------------------------------------------------------------
  # Publish.
  #
  # Runs only for main or a version tag, and only after every check has passed.
  # The image is tagged with the commit SHA as well as the version, so a
  # deployment can be pinned to an exact revision rather than a mutable tag.
  # -------------------------------------------------------------------------
  publish:
    name: Publish the image
    needs: [verify, configuration, container, hygiene]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the image tags
        id: meta
        run: |
          version=$(cat VERSION)
          commit=$(git rev-parse --short HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Immutable tags: the version, and the version plus the commit, so a
          # rebuilt image for the same version is still distinguishable.
          echo "tags=ghcr.io/${{ github.repository }}:${version},ghcr.io/${{ github.repository }}:${version}-${commit}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.built }}
            NODE_ENV=production
          cache-from: type=gha

      - name: Summarise the published artefact
        run: |
          {
            echo '### Published image'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.commit }}\` |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo ''
            echo 'Deploy with the exact revision tag and verify with:'
            echo ''
            echo '```'
            echo 'kubectl set image deployment/taskflow app=ghcr.io/'"${{ github.repository }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.commit }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

